# This workflow is setup by Fei Zhang to use Github Actions 2020-09-14

name: hiperseis_main_ci

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3.1.1
      with:
        auto-update-conda: true
        python-version: 3.6.8
    - name: Installing dependencies
      shell: bash -el {0}
      run: |
        git submodule update --init --recursive
        sudo apt-get install libproj-dev proj-data proj-bin
        sudo apt-get install libgeos-dev
        sudo apt-get install libmpich-dev
        conda install conda-forge::proj
        conda install conda-forge::openmpi=4.1.4=ha1ae619_100
        conda install conda-forge::mpi4py=3.0.3
        conda install conda-forge::cartopy=0.19.0.post1
        conda install conda-forge::obspy
        conda install conda-forge::gcc_linux-64==7.5.0
        pip install Cython --install-option="--no-cython-compile"
        pip install -r tests/requirements.txt
    - name: Running pytest
      shell: bash -el {0}
      run: |
        pytest --cov=tests ./tests/test_convert_logs.py
        coverage report
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@main

