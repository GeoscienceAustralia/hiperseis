# This workflow is setup by Fei Zhang to use Github Actions 2020-09-14

name: hiperseis_main_ci

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup environment
      run: |
        curl -O https://repo.anaconda.com/archive/Anaconda3-2024.10-1-Linux-x86_64.sh && bash ~/Anaconda3-2024.10-1-Linux-x86_64.sh
        source ~/.bashrc
        source conda_env_linux.sh hiperseis
    - name: Running pytest
      run: |
        coverage run -m pytest ./tests
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2.3.6

